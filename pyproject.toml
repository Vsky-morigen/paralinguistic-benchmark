[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paralinguistic-benchmark"
version = "0.4.0"
description = "Reproducible Chinese-English paralinguistic speech understanding benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
audio = ["imageio-ffmpeg>=0.6,<0.7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
parabench = "parabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
